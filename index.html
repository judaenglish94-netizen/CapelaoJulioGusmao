<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capelania - Agendamento</title>
    <!-- Tailwind CSS para estilização moderna e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="bg-slate-800 border-b border-slate-700 py-6 px-4 shadow-md text-center">
        <h1 class="text-2xl font-bold tracking-wide text-amber-400">Sistema de Capelania</h1>
        <p class="text-sm text-slate-400 mt-1">Agendamento de Atendimento e Acolhimento</p>
    </header>

    <!-- Conteúdo Principal / Formulário -->
    <main class="container mx-auto px-4 py-8 max-w-md flex-grow">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
            <h2 class="text-lg font-semibold mb-4 text-slate-200 border-b border-slate-700 pb-2">Marcar Horário</h2>
            
            <form id="agendamentoForm" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-slate-300 mb-1">Seu Nome</label>
                    <input type="text" id="name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-400" placeholder="Digite seu nome completo">
                </div>

                <div>
                    <label for="date" class="block text-sm font-medium text-slate-300 mb-1">Data</label>
                    <input type="date" id="date" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-400">
                </div>

                <div>
                    <label for="time" class="block text-sm font-medium text-slate-300 mb-1">Horário</label>
                    <input type="time" id="time" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-400">
                </div>

                <button type="submit" id="btnSubmit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg mt-2">
                    Confirmar Agendamento
                </button>
            </form>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-500">
        &copy; 2026 Capelania. Todos os direitos reservados.
    </footer>

    <!-- Script de Integração com o Supabase -->
    <script>
        const SUPABASE_URL = 'https://lvmaxonadzgacxksihfu.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_NK6GQuGF5NP1HqAm1ZN4pQ_ktawljLR';

        const form = document.getElementById('agendamentoForm');
        const btnSubmit = document.getElementById('btnSubmit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;

            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Salvando...';

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/appointments`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_PUBLISHABLE_KEY,
                        'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ date, time, name })
                });

                if (!response.ok) {
                    throw new Error('Erro ao salvar no banco de dados.');
                }

                alert('Agendamento realizado com sucesso!');
                form.reset();

            } catch (error) {
                console.error('Erro:', error);
                alert('Ocorreu um erro ao registrar o agendamento. Tente novamente.');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Confirmar Agendamento';
            }
        });
    </script>
</body>
</html>
